name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PKG: com.talnutgiinhaan.game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Гарын үсгийн түлхүүр: эхний удаа үүсгээд нууц (draft) release-д хадгална, дараагийн удаа тэндээс авна.
      - name: Signing key
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          set -E; trap 'echo "FAILED line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p "$RUNNER_TEMP/ks"; cd "$RUNNER_TEMP/ks"
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft==true and .name=="keystore-store")][0].id // empty')
          if [ -n "$RID" ]; then
            echo "Түлхүүр олдлоо (release $RID)"
            for n in tnh.keystore tnh.pass; do
              AID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID" --jq ".assets[] | select(.name==\"$n\") | .id")
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$AID" > "$n"
            done
          else
            echo "Шинэ түлхүүр үүсгэж байна"
            P=$(openssl rand -hex 16)
            printf '%s' "$P" > tnh.pass
            keytool -genkeypair -keystore tnh.keystore -alias tnh -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$P" -keypass "$P" -dname "CN=Tal Nutgiin Khaan, O=Tal Nutgiin Khaan, C=MN"
            gh release create keystore-store tnh.keystore tnh.pass --draft --title keystore-store \
              --notes "Гарын үсгийн түлхүүр. Устгаж болохгүй, нийтэлж болохгүй." 
          fi
          P=$(cat tnh.pass)
          echo "::add-mask::$P"
          echo "KS_FILE=$RUNNER_TEMP/ks/tnh.keystore" >> "$GITHUB_ENV"
          echo "KS_PASS=$P" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore tnh.keystore -storepass "$P" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "FP=$FP" >> "$GITHUB_ENV"
          echo "Fingerprint: $FP"

      - name: assetlinks.json (бүтэн дэлгэцээр нээгдэхэд хэрэгтэй)
        run: |
          set -e
          mkdir -p .well-known
          cat > .well-known/assetlinks.json <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"$PKG","sha256_cert_fingerprints":["$FP"]}}]
          JSON
          sed -i 's/^          //' .well-known/assetlinks.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "assetlinks.json: Android апп-ын гарын үсгийн хурууны хээ"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build APK
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/log.txt"

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5
          cp "$APK" talnutgiinhaan.apk

      - name: Publish release
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk talnutgiinhaan.apk --latest \
            --title "Тал Нутгийн Хаан · Android" \
            --notes "Android хувилбар (build ${{ github.run_number }}). Тоглоомын шинэчлэл автоматаар ирнэ, энэ файлыг дахин татах шаардлагагүй."

      - name: Save log (debug)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lg" && cd "$RUNNER_TEMP/lg"
          git init -q && git checkout -q -b apk-log
          tail -n 150 "$RUNNER_TEMP/log.txt" > log.txt 2>/dev/null || echo "no log" > log.txt
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add log.txt && git commit -q -m "log run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-log || true
